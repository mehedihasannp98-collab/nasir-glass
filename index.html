<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0f1720">
<title>NGIL Hub</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NGIL Hub">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Roboto+Mono:wght@500;700&display=swap');

  :root{
    --bg:#0f1417;
    --surface:#171e22;
    --border:#28323638;
    --border-solid:#283236;
    --text:#eef2f4;
    --muted:#8b98a0;

    --ng-navy:#123c3a;
    --ng-navy-dark:#0b2b29;
    --ng-amber:#d98c3f;

    --tc-bg:#14171A;
    --tc-accent:#4A90D9;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Hind Siliguri','Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }

  /* ============ HOME SCREEN ============ */
  #home{
    position:fixed; inset:0; display:flex; flex-direction:column;
    padding:calc(28px + env(safe-area-inset-top)) 22px 22px;
    animation:fadeIn .25s ease;
  }
  @keyframes fadeIn{from{opacity:0;} to{opacity:1;}}

  .hub-mark{
    width:52px; height:52px; border-radius:14px; overflow:hidden;
    background:#fff; border:1px solid var(--border-solid); margin-bottom:18px;
  }
  .hub-mark img{ width:100%; height:100%; object-fit:contain; padding:5px; box-sizing:border-box; }

  .hub-title{
    font-size:26px; font-weight:700; margin:0; letter-spacing:.2px;
  }
  .hub-sub{
    font-size:12.5px; color:var(--muted); margin-top:5px; letter-spacing:.3px;
  }

  .app-grid{
    margin-top:34px; display:flex; flex-direction:column; gap:16px; flex:1;
  }
  .app-card{
    position:relative; border-radius:18px; padding:22px 20px; overflow:hidden;
    border:1px solid var(--border-solid); cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    transition:transform .15s ease;
    display:flex; align-items:center; gap:16px;
  }
  .app-card:active{ transform:scale(.98); }

  .app-card.ng{
    background:linear-gradient(135deg, var(--ng-navy) 0%, var(--ng-navy-dark) 100%);
  }
  .app-card.tc{
    background:linear-gradient(135deg, #1c2227 0%, #14171A 100%);
    border-color:#2c363c;
  }

  .app-icon{
    flex:none; width:52px; height:52px; border-radius:14px;
    display:flex; align-items:center; justify-content:center;
    font-family:'Roboto Mono',monospace; font-weight:700; font-size:15px; color:#fff;
  }
  .app-card.ng .app-icon{ background:var(--ng-amber); }
  .app-card.tc .app-icon{ background:var(--tc-accent); }

  .app-info{ flex:1; min-width:0; }
  .app-info h2{ margin:0 0 3px; font-size:17px; font-weight:700; color:#fff; }
  .app-info p{ margin:0; font-size:12.5px; color:rgba(255,255,255,.62); line-height:1.4; }

  .app-arrow{
    flex:none; width:30px; height:30px; border-radius:50%;
    background:rgba(255,255,255,.12); display:flex; align-items:center; justify-content:center;
    color:#fff; font-size:16px;
  }

  /* subtle stacked-pane decoration echoing glass panes, tucked in the card corner */
  .app-card::after{
    content:''; position:absolute; right:-18px; top:-18px; width:90px; height:90px;
    border-radius:22px; border:1px solid rgba(255,255,255,.08); transform:rotate(18deg);
  }

  .hub-footer{
    text-align:center; font-size:10.5px; color:var(--muted); letter-spacing:.4px;
    padding-top:14px;
  }

  /* ============ APP FRAME VIEW ============ */
  #frameView{
    position:fixed; inset:0; background:var(--bg);
    display:none; flex-direction:column;
    animation:fadeIn .18s ease;
  }
  #frameView.show{ display:flex; }
  .frame-bar{
    flex:none; display:flex; align-items:center; gap:10px;
    padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
    background:var(--surface); border-bottom:1px solid var(--border-solid);
  }
  .back-btn{
    background:rgba(255,255,255,.08); border:none; color:var(--text);
    width:34px; height:34px; border-radius:10px; font-size:17px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; flex:none;
  }
  .back-btn:active{ background:rgba(255,255,255,.16); }
  .frame-bar .fname{ font-size:14px; font-weight:600; }
  #appFrame{ flex:1; width:100%; border:none; background:#fff; }

  /* ============ LOCK SCREEN ============ */
  #lockScreen{
    position:fixed; inset:0; z-index:50; background:var(--bg);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:24px; text-align:center;
  }
  #lockScreen .lock-logo{
    width:76px; height:76px; border-radius:20px; background:#fff; overflow:hidden;
    margin-bottom:22px; border:1px solid var(--border-solid);
  }
  #lockScreen .lock-logo img{ width:100%; height:100%; object-fit:contain; padding:8px; box-sizing:border-box; }
  #lockScreen h1{ font-size:19px; margin:0 0 6px; }
  #lockScreen p{ font-size:12.5px; color:var(--muted); margin:0 0 30px; max-width:260px; line-height:1.5; }
  .fp-btn{
    width:76px; height:76px; border-radius:50%; border:2px solid var(--ng-amber);
    background:rgba(217,140,63,.1); color:var(--ng-amber); font-size:32px;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    margin-bottom:16px; transition:transform .15s ease;
  }
  .fp-btn:active{ transform:scale(.94); }
  .fp-btn.err{ border-color:#e0554b; color:#e0554b; background:rgba(224,85,75,.1); }
  #lockStatus{ font-size:12.5px; color:var(--muted); min-height:18px; }
  .lock-skip{
    margin-top:26px; background:none; border:none; color:var(--muted);
    font-size:11.5px; text-decoration:underline; cursor:pointer; font-family:inherit;
  }

  /* ============ BOTTOM TAB BAR ============ */
  #home, #frameView{ padding-bottom: calc(86px + env(safe-area-inset-bottom)); }
  #bottomNav{
    position:fixed; left:0; right:0; bottom:0; z-index:40;
    display:flex; align-items:center; justify-content:space-around;
    gap:6px; padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    background:#0e1519; border-top:1px solid var(--border-solid);
  }
  .nav-tab{
    display:flex; flex-direction:column; align-items:center; gap:6px;
    background:none; border:none; cursor:pointer; padding:8px 14px;
    border-radius:16px; transition:background .15s ease;
    font-family:inherit; color:var(--muted);
  }
  .nav-tab.active{ background:#1b2a33; color:#4A90D9; }
  .nav-tab .tab-icon{
    width:34px; height:34px; border-radius:10px; overflow:hidden;
    background:#fff; flex:none;
  }
  .nav-tab .tab-icon img{ width:100%; height:100%; object-fit:cover; }
  .nav-tab.home-tab .tab-icon img{ object-fit:contain; padding:4px; box-sizing:border-box; }
  .nav-tab.active .tab-icon{ box-shadow:0 0 0 2px #4A90D9; }
  .nav-tab span{ font-size:11.5px; font-weight:600; letter-spacing:.2px; }
</style>
</head>
<body>

<div id="lockScreen">
  <div class="lock-logo"><img src="icon-192.png" alt="NGIL"></div>
  <h1>NGIL Hub লক করা আছে</h1>
  <p id="lockDesc">চালিয়ে যেতে ফিঙ্গারপ্রিন্ট দিয়ে যাচাই করুন</p>
  <button class="fp-btn" id="fpBtn">👆</button>
  <div id="lockStatus"></div>
  <button class="lock-skip" id="lockSkip" style="display:none;">ফিঙ্গারপ্রিন্ট ছাড়া চালিয়ে যান</button>
</div>

<div id="home">
  <div class="hub-mark"><img src="icon-192.png" alt="NGIL"></div>
  <h1 class="hub-title">NGIL Hub</h1>
  <div class="hub-sub">Nasir Glass Industries — অ্যাপ লঞ্চার</div>

  <div class="app-grid">
    <div class="app-card ng" data-src="apps/nasirglass/index.html" data-name="Nasir Glass">
      <div class="app-icon" style="background-image:url('apps/nasirglass/icon-192.png');background-size:cover;background-position:center;"></div>
      <div class="app-info">
        <h2>Nasir Glass</h2>
        <p>অর্ডার, ইনভয়েস ও কমিশন</p>
      </div>
      <div class="app-arrow">›</div>
    </div>

    <div class="app-card tc" data-src="apps/toncount/index.html" data-name="TON COUNT">
      <div class="app-icon" style="background-image:url('apps/toncount/icon-192.png');background-size:cover;background-position:center;"></div>
      <div class="app-info">
        <h2>TON COUNT</h2>
        <p>দৈনিক টনেজ হিসাব</p>
      </div>
      <div class="app-arrow">›</div>
    </div>
  </div>

  <div class="hub-footer">Md. Mehedi Hasan — Area Sales Manager, Barishal</div>
</div>

<div id="frameView">
  <div class="frame-bar">
    <button class="back-btn" id="backBtn">‹</button>
    <span class="fname" id="frameName"></span>
  </div>
  <iframe id="appFrame" src=""></iframe>
</div>

<nav id="bottomNav">
  <button class="nav-tab home-tab active" data-tab="home">
    <span class="tab-icon"><img src="icon-192.png" alt="হোম"></span>
    <span>হোম</span>
  </button>
  <button class="nav-tab" data-tab="nasirglass" data-src="apps/nasirglass/index.html" data-name="Nasir Glass">
    <span class="tab-icon"><img src="profile.jpg" alt="Nasir Glass"></span>
    <span>Nasir Glass</span>
  </button>
  <button class="nav-tab" data-tab="toncount" data-src="apps/toncount/index.html" data-name="TON COUNT">
    <span class="tab-icon"><img src="profile.jpg" alt="TON COUNT"></span>
    <span>TON COUNT</span>
  </button>
</nav>

<script>
  // ============ FINGERPRINT LOCK (WebAuthn platform authenticator) ============
  const lockScreen = document.getElementById('lockScreen');
  const fpBtn = document.getElementById('fpBtn');
  const lockStatus = document.getElementById('lockStatus');
  const lockDesc = document.getElementById('lockDesc');
  const lockSkip = document.getElementById('lockSkip');
  const CRED_KEY = 'ngil-hub-cred-id';

  function b64url(buf){
    return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  }
  function b64urlToBuf(str){
    str = str.replace(/-/g,'+').replace(/_/g,'/');
    while(str.length % 4) str += '=';
    const bin = atob(str);
    const buf = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) buf[i] = bin.charCodeAt(i);
    return buf;
  }

  const webAuthnSupported = !!(window.PublicKeyCredential && navigator.credentials);

  async function registerFingerprint(){
    lockStatus.textContent = 'সেটআপ হচ্ছে...';
    try{
      const cred = await navigator.credentials.create({
        publicKey:{
          challenge: crypto.getRandomValues(new Uint8Array(32)),
          rp:{ name:'NGIL Hub' },
          user:{ id: crypto.getRandomValues(new Uint8Array(16)), name:'mehedi@ngil', displayName:'Md. Mehedi Hasan' },
          pubKeyCredParams:[{type:'public-key', alg:-7}, {type:'public-key', alg:-257}],
          authenticatorSelection:{ authenticatorAttachment:'platform', userVerification:'required' },
          timeout:60000
        }
      });
      localStorage.setItem(CRED_KEY, b64url(cred.rawId));
      lockStatus.textContent = 'সেট হয়ে গেছে ✓';
      setTimeout(unlock, 400);
    }catch(err){
      fpBtn.classList.add('err');
      lockStatus.textContent = 'সেটআপ ব্যর্থ — আবার চেষ্টা করুন';
    }
  }

  async function verifyFingerprint(credId){
    lockStatus.textContent = 'যাচাই হচ্ছে...';
    fpBtn.classList.remove('err');
    try{
      await navigator.credentials.get({
        publicKey:{
          challenge: crypto.getRandomValues(new Uint8Array(32)),
          allowCredentials:[{ id:b64urlToBuf(credId), type:'public-key' }],
          userVerification:'required',
          timeout:60000
        }
      });
      lockStatus.textContent = '';
      unlock();
    }catch(err){
      fpBtn.classList.add('err');
      lockStatus.textContent = 'যাচাই ব্যর্থ — আবার চেষ্টা করুন';
    }
  }

  function unlock(){
    lockScreen.style.display = 'none';
  }

  fpBtn.addEventListener('click', ()=>{
    const existing = localStorage.getItem(CRED_KEY);
    if(existing){ verifyFingerprint(existing); } else { registerFingerprint(); }
  });

  lockSkip.addEventListener('click', unlock);

  (function initLock(){
    if(!webAuthnSupported){
      // device/browser can't do platform biometrics — don't lock the person out
      unlock();
      return;
    }
    const existing = localStorage.getItem(CRED_KEY);
    if(!existing){
      lockDesc.textContent = 'প্রথমবার — ফিঙ্গারপ্রিন্ট সেট করতে বাটনে চাপুন';
      lockSkip.style.display = 'block';
    } else {
      lockDesc.textContent = 'চালিয়ে যেতে ফিঙ্গারপ্রিন্ট দিয়ে যাচাই করুন';
    }
  })();

  const frameView = document.getElementById('frameView');
  const appFrame = document.getElementById('appFrame');
  const frameName = document.getElementById('frameName');
  const home = document.getElementById('home');
  const navTabs = document.querySelectorAll('.nav-tab');

  function setActiveTab(tab){
    navTabs.forEach(t=> t.classList.toggle('active', t.dataset.tab === tab));
  }

  function openApp(src, name, tab){
    frameName.textContent = name;
    appFrame.src = src;
    frameView.classList.add('show');
    home.style.display = 'none';
    setActiveTab(tab);
    history.pushState({app:src}, '', '#'+tab);
  }

  document.querySelectorAll('.app-card').forEach(card=>{
    card.addEventListener('click', ()=>{
      const src = card.dataset.src;
      const name = card.dataset.name;
      const tab = src.includes('nasirglass') ? 'nasirglass' : 'toncount';
      openApp(src, name, tab);
    });
  });

  function goHome(){
    frameView.classList.remove('show');
    home.style.display = '';
    appFrame.src = '';
    setActiveTab('home');
  }

  navTabs.forEach(tab=>{
    tab.addEventListener('click', ()=>{
      const t = tab.dataset.tab;
      if(t === 'home'){
        if(frameView.classList.contains('show')){ history.back(); } else { goHome(); }
        return;
      }
      // already on this app — do nothing
      if(frameView.classList.contains('show') && tab.classList.contains('active')) return;
      openApp(tab.dataset.src, tab.dataset.name, t);
    });
  });

  document.getElementById('backBtn').addEventListener('click', ()=>{
    history.back();
  });
  window.addEventListener('popstate', (e)=>{
    if(!e.state || !e.state.app){ goHome(); }
  });

  // deep-link support: NGIL-Hub/#nasirglass or #toncount opens directly
  window.addEventListener('load', ()=>{
    const hash = location.hash.replace('#','');
    const map = { nasirglass: {src:'apps/nasirglass/index.html', name:'Nasir Glass'}, toncount: {src:'apps/toncount/index.html', name:'TON COUNT'} };
    if(map[hash]){
      frameName.textContent = map[hash].name;
      appFrame.src = map[hash].src;
      frameView.classList.add('show');
      home.style.display = 'none';
      setActiveTab(hash);
    }
  });

  if('serviceWorker' in navigator){
    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('sw.js').catch(()=>{});
    });
  }
</script>
</body>
</html>
