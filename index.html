<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#14171A">
<title>TON COUNT — Nasir Glass</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ton Count">
<style>
  :root{
    --bg:#14171A;
    --surface:#1D2226;
    --surface-2:#262C31;
    --surface-3:#2F363C;
    --border:#363E44;
    --text:#EDEFF1;
    --muted:#8F9BA3;
    --muted-2:#657078;
    --accent:#4A90D9;
    --accent-dim:#2E5F8C;
    --good:#5CC98A;
    --danger:#DE6B5F;

    --c-tempered:#E3A034;
    --c-clear:#9FDDE0;
    --c-colour:#9385C4;
    --c-reflective:#4A90D9;
    --c-mirror:#C7CBCF;

    --radius:14px;
    --radius-sm:9px;
    --font-head:Georgia,'Noto Serif Bengali','Times New Roman',serif;
    --font-body:'Segoe UI','Noto Sans Bengali',system-ui,-apple-system,sans-serif;
    --font-mono:ui-monospace,'SFMono-Regular','Cascadia Mono','Roboto Mono',monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    padding-bottom:calc(72px + env(safe-area-inset-bottom));
    min-height:100vh;
  }
  ::selection{background:var(--accent-dim);}

  /* ---------- top bar ---------- */
  .topbar{
    position:sticky; top:0; z-index:20;
    background:linear-gradient(180deg,var(--bg) 70%, transparent);
    padding:18px 18px 8px;
  }
  .brand{
    display:flex; align-items:baseline; justify-content:space-between;
  }
  .brand h1{
    font-family:var(--font-head);
    font-size:22px; font-weight:700; margin:0; letter-spacing:.3px;
  }
  .brand .sub{
    font-size:11px; color:var(--muted-2); letter-spacing:1.5px; text-transform:uppercase;
    font-family:var(--font-mono);
  }
  .menu-btn{
    background:none;border:none;color:var(--muted);font-size:20px;padding:6px 4px;cursor:pointer;
  }

  main{ padding:4px 16px 24px; max-width:520px; margin:0 auto; }
  .screen{ display:none; animation:fade .18s ease; }
  .screen.active{ display:block; }
  @keyframes fade{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;} }

  /* ---------- glass pane stack (signature element) ---------- */
  .pane-stack{
    display:flex; height:14px; border-radius:7px; overflow:hidden;
    background:var(--surface-2); border:1px solid var(--border);
  }
  .pane-stack .seg{ height:100%; min-width:0; transition:flex-basis .3s ease; }
  .pane-stack.empty{ background:var(--surface-2); }
  .pane-legend{
    display:flex; flex-wrap:wrap; gap:10px; margin-top:10px; font-size:11.5px; color:var(--muted);
  }
  .pane-legend span{ display:inline-flex; align-items:center; gap:5px; }
  .dot{ width:9px; height:9px; border-radius:3px; display:inline-block; flex:none; }

  /* ---------- cards ---------- */
  .card{
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius); padding:16px; margin-bottom:14px;
  }
  .card h2{ font-family:var(--font-head); font-size:15px; margin:0 0 12px; color:var(--text); font-weight:600;}
  .row-between{ display:flex; align-items:center; justify-content:space-between; }

  /* ---------- big total ---------- */
  .big-total{
    text-align:center; padding:6px 0 14px;
  }
  .big-total .num{
    font-family:var(--font-mono); font-size:44px; font-weight:600; color:var(--accent);
    letter-spacing:-1px; line-height:1;
  }
  .big-total .label{ font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:1.5px; margin-top:6px;}

  /* ---------- form ---------- */
  .field{ margin-bottom:12px; }
  .field label{
    display:flex; align-items:center; gap:7px; font-size:13px; color:var(--muted); margin-bottom:6px;
  }
  .field input[type=date]{
    width:100%; background:var(--surface-2); border:1px solid var(--border); color:var(--text);
    padding:11px 12px; border-radius:var(--radius-sm); font-size:15px; font-family:var(--font-body);
  }
  .num-row{ display:grid; grid-template-columns:1fr; gap:10px; }
  .num-field{
    display:flex; align-items:center; gap:10px;
    background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-sm);
    padding:8px 12px;
  }
  .num-field .dot{ width:11px; height:11px; }
  .num-field .name{ flex:1; font-size:14.5px; }
  .num-field input{
    width:88px; text-align:right; background:transparent; border:none; color:var(--text);
    font-family:var(--font-mono); font-size:17px; font-weight:600; padding:6px 2px; outline:none;
  }
  .num-field input:focus-visible{ outline:2px solid var(--accent); border-radius:6px; }
  .num-field.tempered{ border-left:3px solid var(--c-tempered); }
  .num-field.clear{ border-left:3px solid var(--c-clear); }
  .num-field.colour{ border-left:3px solid var(--c-colour); }
  .num-field.reflective{ border-left:3px solid var(--c-reflective); }
  .num-field.mirror{ border-left:3px solid var(--c-mirror); }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    width:100%; padding:13px; border-radius:var(--radius-sm); border:none;
    font-size:15px; font-weight:600; cursor:pointer; font-family:var(--font-body);
  }
  .btn-primary{ background:var(--accent); color:#0C1A26; }
  .btn-primary:active{ background:#3f7fc2; }
  .btn-whatsapp{ background:#1E8E5A; color:#EAF8EF; }
  .btn-whatsapp:active{ background:#187348; }
  .btn-ghost{ background:var(--surface-2); color:var(--text); border:1px solid var(--border); }
  .btn-danger{ background:transparent; color:var(--danger); border:1px solid #5A3833; }
  .btn-row{ display:flex; gap:10px; margin-top:14px; }
  .btn-row .btn{ flex:1; }
  .btn-sm{ width:auto; padding:9px 14px; font-size:13px; }

  /* ---------- month selector ---------- */
  .month-nav{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .month-nav button{
    background:var(--surface-2); border:1px solid var(--border); color:var(--text);
    width:38px; height:38px; border-radius:10px; font-size:17px; cursor:pointer;
  }
  .month-nav .month-label{ font-family:var(--font-head); font-size:18px; font-weight:700; text-align:center; }
  .month-nav .month-label small{ display:block; font-family:var(--font-mono); font-size:11px; color:var(--muted); font-weight:400; margin-top:2px;}

  /* ---------- summary grid (share format) ---------- */
  .summary-grid{ display:flex; flex-direction:column; gap:9px; }
  .summary-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:9px 4px; border-bottom:1px dashed var(--border); font-size:14.5px;
  }
  .summary-row:last-child{ border-bottom:none; }
  .summary-row .k{ display:flex; align-items:center; gap:8px; color:var(--muted); }
  .summary-row .v{ font-family:var(--font-mono); font-weight:600; font-size:15.5px; }
  .summary-row.total{ margin-top:4px; padding-top:12px; border-top:1px solid var(--border); border-bottom:none;}
  .summary-row.total .k{ color:var(--text); font-weight:700; }
  .summary-row.total .v{ color:var(--accent); font-size:18px; }

  /* ---------- entry log list ---------- */
  .log-item{
    display:flex; align-items:center; gap:12px;
    padding:11px 4px; border-bottom:1px solid var(--border); cursor:pointer;
  }
  .log-item:last-child{ border-bottom:none; }
  .log-item .date{
    width:44px; flex:none; text-align:center;
  }
  .log-item .date .d{ font-family:var(--font-mono); font-size:18px; font-weight:700; line-height:1; }
  .log-item .date .m{ font-size:10px; color:var(--muted-2); text-transform:uppercase; letter-spacing:.5px; }
  .log-item .mid{ flex:1; min-width:0; }
  .log-item .mini-stack{ display:flex; height:7px; border-radius:4px; overflow:hidden; background:var(--surface-2); margin-bottom:5px;}
  .log-item .mini-stack .seg{ height:100%; }
  .log-item .cats{ font-size:11px; color:var(--muted-2); font-family:var(--font-mono); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .log-item .total{ font-family:var(--font-mono); font-weight:700; font-size:15px; flex:none; }
  .empty-note{ text-align:center; color:var(--muted-2); font-size:13px; padding:26px 10px; }

  /* ---------- overview / year table ---------- */
  .year-nav{ display:flex; align-items:center; justify-content:center; gap:16px; margin-bottom:16px; }
  .year-nav button{ background:var(--surface-2); border:1px solid var(--border); color:var(--text); width:34px; height:34px; border-radius:9px; font-size:15px; cursor:pointer;}
  .year-nav .yr{ font-family:var(--font-head); font-size:19px; font-weight:700; min-width:64px; text-align:center;}

  .month-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:13px 15px; margin-bottom:10px;
  }
  .month-card.zero{ opacity:.45; }
  .month-card .row-between{ margin-bottom:9px; }
  .month-card .mname{ font-weight:700; font-size:14.5px; }
  .month-card .mtotal{ font-family:var(--font-mono); font-weight:700; color:var(--accent); font-size:15px; }
  .pill-row{ display:flex; flex-wrap:wrap; gap:6px; }
  .pill{
    font-size:11px; font-family:var(--font-mono); padding:3px 8px; border-radius:20px;
    background:var(--surface-2); border:1px solid var(--border); color:var(--muted);
  }
  .pill.has{ color:var(--text); border-color:transparent; }

  .year-total-card{
    background:linear-gradient(135deg,var(--surface-2),var(--surface)); border:1px solid var(--border);
    border-radius:var(--radius); padding:18px; text-align:center; margin-top:6px; margin-bottom:16px;
  }
  .year-total-card .num{ font-family:var(--font-mono); font-size:32px; font-weight:700; color:var(--accent); }
  .year-total-card .label{ font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:1.5px; margin-top:4px;}

  /* ---------- bottom nav ---------- */
  nav.tabbar{
    position:fixed; left:0; right:0; bottom:0; z-index:30;
    background:var(--surface); border-top:1px solid var(--border);
    display:flex; padding:6px 10px calc(6px + env(safe-area-inset-bottom));
  }
  nav.tabbar button{
    flex:1; background:none; border:none; color:var(--muted-2); cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:3px; padding:8px 4px; font-family:var(--font-body);
    font-size:11px;
  }
  nav.tabbar button svg{ width:21px; height:21px; }
  nav.tabbar button.active{ color:var(--accent); }

  /* ---------- toast ---------- */
  #toast{
    position:fixed; left:50%; bottom:90px; transform:translateX(-50%) translateY(20px);
    background:var(--surface-3); color:var(--text); padding:10px 18px; border-radius:30px;
    font-size:13px; opacity:0; pointer-events:none; transition:all .25s ease; z-index:50;
    border:1px solid var(--border); white-space:nowrap;
  }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* ---------- menu sheet ---------- */
  .sheet-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:40; opacity:0; pointer-events:none; transition:opacity .2s;
  }
  .sheet-backdrop.show{ opacity:1; pointer-events:auto; }
  .sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:41;
    background:var(--surface); border-radius:18px 18px 0 0; border:1px solid var(--border); border-bottom:none;
    padding:10px 16px calc(20px + env(safe-area-inset-bottom));
    transform:translateY(100%); transition:transform .25s ease;
  }
  .sheet.show{ transform:translateY(0); }
  .sheet .handle{ width:36px; height:4px; background:var(--border); border-radius:3px; margin:6px auto 14px; }
  .sheet button.item{
    width:100%; text-align:left; background:none; border:none; color:var(--text); font-size:15px;
    padding:13px 4px; border-bottom:1px solid var(--border); font-family:var(--font-body);
  }
  .sheet button.item:last-of-type{ border-bottom:none; }
  .sheet button.item.danger{ color:var(--danger); }

  small.hint{ display:block; color:var(--muted-2); font-size:11.5px; margin-top:8px; }
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
</head>
<body>

<!-- BOOT CHECK: shown briefly while we ask Firebase "is anyone already logged in?" -->
<div id="boot-check" style="position:fixed;inset:0;background:#14171A;display:flex;align-items:center;justify-content:center;z-index:9999;color:#8F9BA3;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:14px;">লোড হচ্ছে…</div>

<!-- LOGIN SCREEN -->
<div id="login-screen" class="hidden" style="position:fixed;inset:0;background:#14171A;z-index:9998;display:flex;align-items:center;justify-content:center;padding:24px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <div style="width:100%;max-width:360px;">
    <div style="text-align:center;margin-bottom:28px;">
      <div style="font-size:20px;font-weight:700;color:#EDEFF1;">TON COUNT</div>
      <div style="font-size:13px;color:#8F9BA3;margin-top:4px;">Nasir Glass · টন হিসাব — লগইন করুন</div>
    </div>

    <div id="login-form">
      <input type="email" id="login-email" placeholder="ইমেইল" style="width:100%;padding:13px 14px;margin-bottom:10px;border-radius:12px;border:1px solid #363E44;background:#1D2226;color:#EDEFF1;font-size:15px;">
      <input type="password" id="login-pass" placeholder="পাসওয়ার্ড" style="width:100%;padding:13px 14px;margin-bottom:10px;border-radius:12px;border:1px solid #363E44;background:#1D2226;color:#EDEFF1;font-size:15px;">
      <div id="login-err" style="color:#DE6B5F;font-size:13px;min-height:18px;margin-bottom:6px;"></div>
      <button id="login-btn" onclick="doLogin()" style="width:100%;padding:13px;border:none;border-radius:12px;background:#4A90D9;color:#fff;font-size:15px;font-weight:700;">লগইন করুন</button>
      <div style="text-align:center;margin-top:16px;font-size:13px;color:#8F9BA3;">অ্যাকাউন্ট নেই? <a href="#" onclick="showSignup();return false;" style="color:#4A90D9;">তৈরি করুন</a></div>
    </div>

    <div id="signup-form" style="display:none;">
      <input type="email" id="signup-email" placeholder="ইমেইল" style="width:100%;padding:13px 14px;margin-bottom:10px;border-radius:12px;border:1px solid #363E44;background:#1D2226;color:#EDEFF1;font-size:15px;">
      <input type="password" id="signup-pass" placeholder="পাসওয়ার্ড (অন্তত ৬ অক্ষর)" style="width:100%;padding:13px 14px;margin-bottom:10px;border-radius:12px;border:1px solid #363E44;background:#1D2226;color:#EDEFF1;font-size:15px;">
      <input type="password" id="signup-pass2" placeholder="পাসওয়ার্ড আবার লিখুন" style="width:100%;padding:13px 14px;margin-bottom:10px;border-radius:12px;border:1px solid #363E44;background:#1D2226;color:#EDEFF1;font-size:15px;">
      <div id="signup-err" style="color:#DE6B5F;font-size:13px;min-height:18px;margin-bottom:6px;"></div>
      <button id="signup-btn" onclick="doSignup()" style="width:100%;padding:13px;border:none;border-radius:12px;background:#4A90D9;color:#fff;font-size:15px;font-weight:700;">অ্যাকাউন্ট তৈরি করুন</button>
      <div style="text-align:center;margin-top:16px;font-size:13px;color:#8F9BA3;">আগে থেকে অ্যাকাউন্ট আছে? <a href="#" onclick="showLogin();return false;" style="color:#4A90D9;">লগইন করুন</a></div>
    </div>
  </div>
</div>
<style>#boot-check.hidden, #login-screen.hidden{display:none !important;}</style>

<div id="app-root" style="display:none;">

<div class="topbar">
  <div class="brand">
    <div>
      <h1>TON COUNT</h1>
      <div class="sub">Nasir Glass · টন হিসাব</div>
    </div>
    <button class="menu-btn" id="menuBtn" aria-label="মেনু">⋮</button>
  </div>
</div>

<main>

  <!-- ================= ENTRY SCREEN ================= -->
  <section class="screen active" id="screen-entry">

    <div class="card">
      <div class="field">
        <label for="entryDate">তারিখ</label>
        <input type="date" id="entryDate">
      </div>

      <div class="num-row" id="numInputs">
        <div class="num-field tempered">
          <span class="dot" style="background:var(--c-tempered)"></span>
          <span class="name">Tempered</span>
          <input type="number" inputmode="decimal" step="0.01" min="0" id="in-tempered" placeholder="0">
        </div>
        <div class="num-field clear">
          <span class="dot" style="background:var(--c-clear)"></span>
          <span class="name">Clear</span>
          <input type="number" inputmode="decimal" step="0.01" min="0" id="in-clear" placeholder="0">
        </div>
        <div class="num-field colour">
          <span class="dot" style="background:var(--c-colour)"></span>
          <span class="name">Colour</span>
          <input type="number" inputmode="decimal" step="0.01" min="0" id="in-colour" placeholder="0">
        </div>
        <div class="num-field reflective">
          <span class="dot" style="background:var(--c-reflective)"></span>
          <span class="name">Reflective</span>
          <input type="number" inputmode="decimal" step="0.01" min="0" id="in-reflective" placeholder="0">
        </div>
        <div class="num-field mirror">
          <span class="dot" style="background:var(--c-mirror)"></span>
          <span class="name">Mirror</span>
          <input type="number" inputmode="decimal" step="0.01" min="0" id="in-mirror" placeholder="0">
        </div>
      </div>

      <div class="big-total">
        <div class="num" id="entryTotal">0.00</div>
        <div class="label">Total Ton</div>
      </div>

      <div class="btn-row">
        <button class="btn btn-primary" id="saveBtn">সেভ করুন</button>
      </div>
      <div class="btn-row">
        <button class="btn btn-whatsapp" id="shareEntryBtn">WhatsApp-এ শেয়ার</button>
      </div>
      <div class="btn-row" id="deleteEntryRow" style="display:none;">
        <button class="btn btn-danger" id="deleteEntryBtn">এই তারিখের এন্ট্রি মুছুন</button>
      </div>
    </div>

    <div class="card">
      <div class="row-between">
        <h2>সাম্প্রতিক এন্ট্রি</h2>
      </div>
      <div id="recentList"></div>
    </div>

  </section>

  <!-- ================= MONTH SCREEN ================= -->
  <section class="screen" id="screen-month">

    <div class="month-nav">
      <button id="monthPrev">‹</button>
      <div class="month-label"><span id="monthLabel">—</span><small id="monthSub">&nbsp;</small></div>
      <button id="monthNext">›</button>
    </div>

    <div class="card">
      <div class="pane-stack empty" id="monthPaneStack"></div>
      <div class="pane-legend" id="monthLegend"></div>
    </div>

    <div class="card">
      <div class="row-between">
        <h2>মাসিক সামারি</h2>
        <button class="btn btn-whatsapp btn-sm" id="shareMonthBtn">Share</button>
      </div>
      <div class="summary-grid" id="monthSummary"></div>
    </div>

    <div class="card">
      <h2>দৈনিক লগ (<span id="monthLogCount">0</span> এন্ট্রি)</h2>
      <div id="monthLog"></div>
    </div>

  </section>

  <!-- ================= OVERVIEW SCREEN ================= -->
  <section class="screen" id="screen-overview">

    <div class="year-nav">
      <button id="yearPrev">‹</button>
      <div class="yr" id="yearLabel">2026</div>
      <button id="yearNext">›</button>
    </div>

    <div class="year-total-card">
      <div class="num" id="yearTotal">0.00</div>
      <div class="label">বছরের মোট টন</div>
    </div>

    <div id="monthsOverview"></div>

    <div class="btn-row">
      <button class="btn btn-whatsapp" id="shareYearBtn">বছরের সামারি শেয়ার করুন</button>
    </div>

  </section>

</main>

<nav class="tabbar">
  <button data-tab="entry" class="active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
    এন্ট্রি
  </button>
  <button data-tab="month">

async function pushToCloud(){
  if(!db) return;
  try{ await db.collection('toncount').doc('entries').set({data: entries}); }
  catch(e){
    console.error('Firestore save failed (toncount):', e);
    toast('⚠️ ক্লাউডে সেভ হয়নি — এই ডিভাইসে সেভ আছে');
  }
}
async function pullFromCloud(){
  if(!db) return;
  try{
    const snap = await db.collection('toncount').doc('entries').get();
    if(snap.exists){
      // Cloud is the single source of truth (every save uploads the FULL data set),
      // so we replace local data with it — this makes deletions sync correctly too.
      entries = snap.data().data || {};
      localStorage.setItem(STORE_KEY, JSON.stringify(entries));
    } else {
      // nothing in the cloud yet — push whatever we have locally so it becomes the baseline
      await pushToCloud();
    }
  }catch(e){ console.error('Firestore load failed (toncount):', e); }
}

  if(code.includes('network-request-failed')) return 'ইন্টারনেট সংযোগ পাওয়া যাচ্ছে না';
  if(code.includes('too-many-requests')) return 'অনেকবার চেষ্টা হয়েছে, একটু পর আবার চেষ্টা করুন';

}

/* ============================================================

const BN_MONTHS = ['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];
const EN_MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const BN_DIGITS = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];

function pad2(n){ return n.toString().padStart(2,'0'); }
function todayStr(){
  const d = new Date();
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
}
function fmt(n){
  n = Number(n)||0;
  return n.toFixed(2);
}
function entryTotal(e){
  return CATS.reduce((s,c)=> s + (Number(e[c])||0), 0);
}
function monthKey(dateStr){ return dateStr.slice(0,7); }
function monthEntries(ym){
  return Object.keys(entries).filter(d => d.startsWith(ym)).sort();
}
function monthSums(ym){
  const sums = {tempered:0,clear:0,colour:0,reflective:0,mirror:0};
  monthEntries(ym).forEach(d=>{
    CATS.forEach(c => sums[c] += Number(entries[d][c])||0);
  });
  return sums;
}
function catColor(c){ return getComputedStyle(document.documentElement).getPropertyValue('--c-'+c).trim(); }

function buildPaneStack(el, sums){
  const total = CATS.reduce((s,c)=>s+sums[c],0);
  el.innerHTML = '';
  el.classList.toggle('empty', total<=0);
  if(total<=0) return;
  CATS.forEach(c=>{
    if(sums[c]<=0) return;
    const seg = document.createElement('div');
    seg.className = 'seg';
    seg.style.background = `var(--c-${c})`;
    seg.style.flex = (sums[c]/total).toFixed(4);
    el.appendChild(seg);
  });
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=> t.classList.remove('show'), 1800);
}

function waShare(text){
  const url = 'https://wa.me/?text=' + encodeURIComponent(text);
  window.open(url, '_blank');
}

function shareTextForEntry(dateStr, e){
  const d = new Date(dateStr+'T00:00:00');
  const label = `${d.getDate()} ${BN_MONTHS[d.getMonth()]} ${d.getFullYear()}`;
  return `*NASIR GLASS — TON COUNT*\n${label}\n\n`+
    `Tempered : ${fmt(e.tempered)}\n`+
    `Clear : ${fmt(e.clear)}\n`+
    `Colour : ${fmt(e.colour)}\n`+
    `Reflective : ${fmt(e.reflective)}\n`+
    `Mirror : ${fmt(e.mirror)}\n`+
    `Total Ton : ${fmt(entryTotal(e))}`;
}
function shareTextForMonth(ym){
  const s = monthSums(ym);
  const total = CATS.reduce((a,c)=>a+s[c],0);
  const [y,m] = ym.split('-');
  const label = `${BN_MONTHS[parseInt(m,10)-1]} ${y}`;
  const days = monthEntries(ym).length;
  return `*NASIR GLASS — MONTHLY TON COUNT*\n${label}  (${days} দিনের এন্ট্রি)\n\n`+
    `Tempered : ${fmt(s.tempered)}\n`+
    `Clear : ${fmt(s.clear)}\n`+
    `Colour : ${fmt(s.colour)}\n`+
    `Reflective : ${fmt(s.reflective)}\n`+
    `Mirror : ${fmt(s.mirror)}\n`+
    `Total Ton : ${fmt(total)}`;
}
function shareTextForYear(year){
  let lines = [`*NASIR GLASS — YEARLY TON COUNT ${year}*`, ''];
  let grand = {tempered:0,clear:0,colour:0,reflective:0,mirror:0};
  let grandTotal = 0;
  for(let m=0;m<12;m++){
    const ym = `${year}-${pad2(m+1)}`;
    const s = monthSums(ym);
    const t = CATS.reduce((a,c)=>a+s[c],0);
    if(t<=0) continue;
    grandTotal += t;
    CATS.forEach(c=> grand[c]+=s[c]);
    lines.push(`${BN_MONTHS[m]}: ${fmt(t)} টন`);
  }
  lines.push('');
  lines.push(`Tempered : ${fmt(grand.tempered)}`);
  lines.push(`Clear : ${fmt(grand.clear)}`);
  lines.push(`Colour : ${fmt(grand.colour)}`);
  lines.push(`Reflective : ${fmt(grand.reflective)}`);
  lines.push(`Mirror : ${fmt(grand.mirror)}`);
  lines.push(`Total Ton : ${fmt(grandTotal)}`);
  return lines.join('\n');
}

function logItemHTML(d){
  const e = entries[d];

  const catStr = CATS.filter(c=>e[c]>0).map(c=>`${CAT_LABEL[c][0]}:${fmt(e[c])}`).join('  ');
  let segs = '';
  CATS.forEach(c=>{
    if(e[c]>0){ segs += `<div class="seg" style="background:var(--c-${c});flex:${(e[c]/total).toFixed(4)}"></div>`; }
  });
  return `<div class="log-item" data-date="${d}">
    <div class="date"><div class="d">${dt.getDate()}</div><div class="m">${EN_MONTHS[dt.getMonth()]}</div></div>
    <div class="mid">
      <div class="mini-stack">${segs}</div>
      <div class="cats">${catStr || 'কোনো ডেটা নেই'}</div>
    </div>
    <div class="total">${fmt(total)}</div>
  </div>`;
}

/* ============================================================
   MONTH SCREEN
   ============================================================ */
let currentYM = todayStr().slice(0,7);

function renderMonth(){
  const [y,m] = currentYM.split('-').map(Number);
  document.getElementById('monthLabel').textContent = BN_MONTHS[m-1];
  document.getElementById('monthSub').textContent = y;

  const sums = monthSums(currentYM);
  buildPaneStack(document.getElementById('monthPaneStack'), sums);

  const legend = document.getElementById('monthLegend');
  legend.innerHTML = CATS.map(c=>`<span><span class="dot" style="background:var(--c-${c})"></span>${CAT_LABEL[c]}</span>`).join('');

  const total = CATS.reduce((a,c)=>a+sums[c],0);
  document.getElementById('monthSummary').innerHTML = CATS.map(c=>`
    <div class="summary-row">
      <span class="k"><span class="dot" style="background:var(--c-${c})"></span>${CAT_LABEL[c]}</span>
      <span class="v">${fmt(sums[c])}</span>
    </div>`).join('') + `
    <div class="summary-row total">
      <span class="k">Total Ton</span>
      <span class="v">${fmt(total)}</span>
    </div>`;

  const dates = monthEntries(currentYM).slice().reverse();
  document.getElementById('monthLogCount').textContent = dates.length;
  const logEl = document.getElementById('monthLog');
  if(dates.length===0){
    logEl.innerHTML = '<div class="empty-note">এই মাসে কোনো এন্ট্রি নেই</div>';
  }else{
    logEl.innerHTML = dates.map(d=>logItemHTML(d)).join('');
    logEl.querySelectorAll('.log-item').forEach(el=>{
      el.addEventListener('click', ()=>{
        showTab('entry');
        entryDateInput.value = el.dataset.date;
        loadEntryForm(el.dataset.date);
      });
    });
  }
}
document.getElementById('monthPrev').addEventListener('click', ()=>{ shiftMonth(-1); });
document.getElementById('monthNext').addEventListener('click', ()=>{ shiftMonth(1); });
function shiftMonth(delta){
  let [y,m] = currentYM.split('-').map(Number);
  m += delta;
  if(m<1){ m=12; y--; } if(m>12){ m=1; y++; }
  currentYM = `${y}-${pad2(m)}`;
  renderMonth();
}
document.getElementById('shareMonthBtn').addEventListener('click', ()=>{
  waShare(shareTextForMonth(currentYM));
});

/* ============================================================
   OVERVIEW SCREEN
   ============================================================ */
let currentYear = parseInt(todayStr().slice(0,4),10);

function renderOverview(){
  document.getElementById('yearLabel').textContent = currentYear;
  let grandTotal = 0;
  let html = '';
  for(let m=0;m<12;m++){
    const ym = `${currentYear}-${pad2(m+1)}`;
    const sums = monthSums(ym);
    const total = CATS.reduce((a,c)=>a+sums[c],0);
    grandTotal += total;
    const isZero = total<=0;
    html += `<div class="month-card ${isZero?'zero':''}">
      <div class="row-between">
        <span class="mname">${BN_MONTHS[m]}</span>
        <span class="mtotal">${isZero? '—' : fmt(total)+' টন'}</span>
      </div>
      <div class="pill-row">
        ${CATS.map(c=>`<span class="pill ${sums[c]>0?'has':''}">${CAT_LABEL[c]} ${sums[c]>0?fmt(sums[c]):'–'}</span>`).join('')}
      </div>
    </div>`;
  }
  document.getElementById('monthsOverview').innerHTML = html;
  document.getElementById('yearTotal').textContent = fmt(grandTotal);
}
document.getElementById('yearPrev').addEventListener('click', ()=>{ currentYear--; renderOverview(); });
document.getElementById('yearNext').addEventListener('click', ()=>{ currentYear++; renderOverview(); });
document.getElementById('shareYearBtn').addEventListener('click', ()=>{
  waShare(shareTextForYear(currentYear));
});

/* ============================================================
   MENU SHEET
   ============================================================ */
const sheet = document.getElementById('menuSheet');
const backdrop = document.getElementById('sheetBackdrop');
function openSheet(){ sheet.classList.add('show'); backdrop.classList.add('show'); }
function closeSheet(){ sheet.classList.remove('show'); backdrop.classList.remove('show'); }
document.getElementById('menuBtn').addEventListener('click', openSheet);
backdrop.addEventListener('click', closeSheet);

document.getElementById('exportBtn').addEventListener('click', ()=>{
  const blob = new Blob([JSON.stringify(entries, null, 1)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `ton-count-backup-${todayStr()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  closeSheet();
  toast('ব্যাকআপ ডাউনলোড হয়েছে');
});
document.getElementById('resetBtn').addEventListener('click', ()=>{
  closeSheet();
  if(!confirm('সব ডেটা স্থায়ীভাবে মুছে ফেলা হবে। আপনি কি নিশ্চিত?')) return;
  entries = {};
  localStorage.removeItem(STORE_KEY);
  localStorage.removeItem(SEED_FLAG);
  saveEntries();
  loadEntryForm(entryDateInput.value);
  renderRecentList();
  toast('সব ডেটা মুছে ফেলা হয়েছে');
});

let deferredInstall = null;
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredInstall = e;
});
document.getElementById('installBtn').addEventListener('click', async ()=>{
  closeSheet();
  if(deferredInstall){
    deferredInstall.prompt();
    await deferredInstall.userChoice;
    deferredInstall = null;
  }else{
    toast('ব্রাউজার মেনু থেকে "Add to Home Screen" ব্যবহার করুন');
  }
});

/* ============================================================
   INIT
   ============================================================ */
function boot(){
  entryDateInput.value = todayStr();
  loadEntryForm(todayStr());
  renderRecentList();
}

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
